name: Build AI Camera Pro APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

# "contents: write" is needed to publish the APK as a GitHub Release
# (easy to download directly on the phone).
permissions:
  contents: write

jobs:
  build:
    name: Build installable APK (OnePlus 8 / Android 13)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Locate and rename APK
        id: apk
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/AI-Camera-Pro-OnePlus8.apk
          ls -lh dist
          echo "path=dist/AI-Camera-Pro-OnePlus8.apk" >> "$GITHUB_OUTPUT"

      - name: Show APK signature (should be identical on every build)
        continue-on-error: true
        shell: bash
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/apksigner" verify --print-certs dist/AI-Camera-Pro-OnePlus8.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Camera-Pro-OnePlus8-APK
          path: dist/AI-Camera-Pro-OnePlus8.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK as GitHub Release "latest"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "${{ steps.apk.outputs.path }}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "AI Camera Pro - latest build" \
            --notes "Direct-download APK for OnePlus 8 (Android 13). Download AI-Camera-Pro-OnePlus8.apk and install."
