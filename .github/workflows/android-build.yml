name: Build AI Camera Pro APK

on:
  push:
    branches: [main, daylight-natural-color]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

# "contents: write" is needed to publish the APK as a GitHub Release
# (easy to download directly on the phone).
permissions:
  contents: write

jobs:
  build:
    name: Build installable APK (OnePlus 8 / Android 13)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Locate and rename APK
        id: apk
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          mkdir -p dist
          BUILD_TIME=$(TZ=Asia/Dhaka date +'%Y%m%d-%H%M%S-BD')
          APK_NAME="AI-Camera-Pro-OnePlus8-${BUILD_TIME}.apk"
          cp "$APK" "dist/$APK_NAME"
          ls -lh dist
          echo "path=dist/$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Show APK signature (should be identical on every build)
        continue-on-error: true
        shell: bash
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/apksigner" verify --print-certs "${{ steps.apk.outputs.path }}"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Camera-Pro-OnePlus8-${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download on GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi
          gh release create latest "${{ steps.apk.outputs.path }}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "AI Camera Pro - latest build" \
            --notes "Direct APK download: ${{ steps.apk.outputs.name }}. Build timestamp is Bangladesh time (Asia/Dhaka, UTC+6). Install on OnePlus 8 (Android 13)."
